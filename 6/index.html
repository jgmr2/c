<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servidor C</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 60px 40px;
            max-width: 600px;
            text-align: center;
            animation: slideUp 0.6s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            color: #667eea;
            font-size: 3em;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 40px;
        }
        .features {
            display: grid;
            gap: 20px;
            margin: 40px 0;
        }
        .feature {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .feature h3 {
            color: #667eea;
            margin-bottom: 8px;
        }
        .feature p {
            color: #666;
            font-size: 0.95em;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 20px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 40px 0;
            gap: 20px;
        }
        .stat {
            flex: 1;
        }
        .stat-number {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
        }
        .stat-label {
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Servidor HTTP</h1>
        <p class="subtitle">Hecho en C puro</p>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-number">100%</div>
                <div class="stat-label">Funcional</div>
            </div>
            <div class="stat">
                <div class="stat-number">~200</div>
                <div class="stat-label">Líneas de código</div>
            </div>
            <div class="stat">
                <div class="stat-number">⚡</div>
                <div class="stat-label">Rápido</div>
            </div>
        </div>

        <div class="features">
            <div class="feature">
                <h3>📁 Archivos estáticos</h3>
                <p>Sirve HTML, CSS, JS y más</p>
            </div>
            <div class="feature">
                <h3>🔧 Fácil de usar</h3>
                <p>Sin dependencias externas</p>
            </div>
            <div class="feature">
                <h3>🎯 Ligero</h3>
                <p>Mínimo uso de recursos</p>
            </div>
        </div>

        <a href="#" class="btn">Ver código</a>
    </div>
</body>
</html>
